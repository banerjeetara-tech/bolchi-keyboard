name: Build Bolchi Keyboard APK
on:
  push:
    branches: [main, next]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bolchi-keyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bolchi-keyboard-apk
          path: bolchi-keyboard.apk
      - name: Publish as a release (easy phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bolchi Keyboard build ${{ github.run_number }}
          files: bolchi-keyboard.apk
