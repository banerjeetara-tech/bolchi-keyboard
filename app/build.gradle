plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tara.bolchi'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tara.bolchi'
        minSdk 24
        targetSdk 34
        versionCode 138
        versionName '138.0'
    }
    signingConfigs {
        debug {
            storeFile file('bolchi.keystore')
            storePassword 'bolchi123'
            keyAlias 'bolchi'
            keyPassword 'bolchi123'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Google's on-device translation (free, no key, works without internet once the languages are downloaded)
    implementation 'com.google.mlkit:translate:17.0.3'
}
