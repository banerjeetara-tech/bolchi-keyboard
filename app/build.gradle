plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tara.bolchi'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tara.bolchi'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '12.0'
    }
    signingConfigs {
        debug {
            storeFile file('bolchi.keystore')
            storePassword 'bolchi123'
            keyAlias 'bolchi'
            keyPassword 'bolchi123'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
