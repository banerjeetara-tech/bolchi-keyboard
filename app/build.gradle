plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tara.bolchi'
    compileSdk 34
    defaultConfig {
        applicationId 'com.tara.bolchi'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
